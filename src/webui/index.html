<!doctype html>
<!-- SimpleHar SE — control page (Step 14). Pico CSS base, vanilla JS only; all
     state comes from /har/* JSON and every action is a headless API call. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SimpleHar SE</title>
    <link rel="stylesheet" href="/pico.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <button id="sh-theme-toggle" class="sh-mini sh-theme-toggle outline">Light</button>
    <!-- Static, like the theme toggle: an operator holding a wrong token never gets a
         rendered header, and this is their way back in (app.js signIn). -->
    <button id="sh-token-toggle" class="sh-mini sh-token-toggle outline">Sign in</button>
    <header class="sh-header" id="sh-header">
      <!-- rendered by app.js: title, loaded count, the sticky tab/slot strip, memory -->
    </header>
    <main class="container" id="sh-main">
      <!-- rendered by app.js: model table, recent jobs -->
    </main>
    <div
      id="sh-flash"
      class="sh-flash"
      hidden
      role="alert"
      style="position: fixed; bottom: 1rem; left: 1rem; right: 1rem; z-index: 20"
    ></div>
    <script src="/app.js"></script>
  </body>
</html>
