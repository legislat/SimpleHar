# cargo-deny policy (FR-14). The deny CI job runs this file.
# Rule: a new dependency must land inside these gates, or the change names
# the exception and why (docs/process/ENGINEERING.md, Dependency policy).

[advisories]
yanked = "deny"
# RUSTSEC-2024-0370 (proc-macro-error unmaintained): reached only through
# tray-icon -> libappindicator -> gtk -> glib -> glib-macros, a Linux-only
# chain. This crate builds on Windows only, so the advisory never describes
# built code. No safe upgrade exists; revisit when tray-icon updates.
ignore = ["RUSTSEC-2024-0370"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "MPL-2.0",
]

# fnv declares its license as the free-text field "Apache-2.0 / MIT", which is
# not valid SPDX, so the scanner cannot match the allow list. Both halves of
# that field are already allowed above.
[[licenses.exceptions]]
name = "fnv"
allow = ["MIT", "Apache-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
