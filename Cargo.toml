[package]
name = "simpleharn"
version = "1.3.4"
edition = "2021"
rust-version = "1.88"
description = "One app managing local inference engines with a simple, reliable, adjustable model swap"
license = "Apache-2.0"
repository = "https://github.com/legislat/SimpleHarn"
readme = "README.md"

[dependencies]
# HTTP framework: async handlers returning Result<Response, ApiError> (AGENTS.md convention).
axum = "0.8"
# Async runtime; the minimal explicit feature set the crate uses (TASK-N7-DEPS):
# rt (via rt-multi-thread) + macros (#[tokio::main]/select!/join!), signal (ctrl_c),
# fs, process, sync, time, net, io-util (AsyncRead/WriteExt).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "process",
    "sync",
    "time",
    "net",
    "io-util",
] }
# HTTP layers: tracing, compression, timeouts (AGENTS.md observability rule).
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "timeout"] }
# Structured logging; no println!/eprintln! on production paths (AGENTS.md).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error taxonomy per layer (Step 17); anyhow only at main.
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# dyn-compatible async methods for the EngineRuntime trait (Step 7).
async-trait = "0.1"
# HTTP client: engine readiness probes now (mock engine), proxy surface later (Step 11).
# `stream` enables byte-for-byte SSE pass-through.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
# Tray icon + menu (Step 15): the only GUI dependency; no Qt/egui.
tray-icon = "0.26"
# Win32: tray message pump (Step 15) and Job Objects + single-instance mutex (Step 8).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
] }

# Stream adapters: broadcast receiver -> SSE body stream (Step 12 events).
tokio-stream = { version = "0.1", features = ["sync"] }
# NVML in-process witness with a graceful `nvidia-smi` fallback (Step 4, item 5).
nvml-wrapper = "0.13"
# Base64 for staging a harness-rendered autostart script into the distro: the script
# body rides a quoted heredoc inside a driver fed to `wsl … -- bash -s` on stdin
# (template adoption, 2026-10-31), so it never touches a shell-tokenized command
# line, only this alphabet.
base64 = "0.23"

[dev-dependencies]
# `tower::ServiceExt::oneshot` drives the router in tests without binding a port.
tower = "0.5"

# Approved but deliberately absent until its module lands (no unused deps):
# - yaml crate    -> Step 9 ModelConf write-back (flat key: value round-trip)

# Release profile for the v1.0 artifact (AGENTS.md: fully optimized). Fat LTO across
# crates plus a single codegen unit trade build time for a smaller, faster binary, which
# is worth it for a long-running harness with a hot proxy path.
#
# Panics deliberately stay unwound: several types own live engine children and reap them
# in `Drop` (the scheduler handle, the harness's job-object child). `panic = "abort"`
# skips those drops and would leave `llama-server` processes orphaned on the card.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
