# Cardless CI (decision D7): checks only. No card tests, no model loads, and
# no engine start here; the card gate stays operator-only per
# docs/process/VERIFICATION.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cardless gate
        shell: pwsh
        run: ./scripts/gate.ps1

      - name: Doc check
        shell: pwsh
        run: node scripts/check-docs.mjs

      - name: Doc facts
        shell: pwsh
        run: node scripts/check-doc-facts.mjs

      # Task files live in handoff/, which is gitignored and absent on the runner.
      # The task checker runs in the local pre-commit workflow, not here.
      - name: Instruction check
        shell: pwsh
        run: node scripts/check-instructions.mjs

  # MSRV gate: Cargo.toml declares rust-version 1.88. This job must build on
  # exactly that toolchain, so a dependency bump cannot silently raise it.
  # The committed rust-toolchain.toml outranks the toolchain selected by
  # dtolnay/rust-toolchain, so the check pins the toolchain explicitly with
  # `+1.88.0` (and the step env) instead of relying on the action's default.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.120.0

      - uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
        run: cargo +1.88.0 check --locked --all-targets

  # Dependency policy: advisories, licenses, bans, and sources (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
