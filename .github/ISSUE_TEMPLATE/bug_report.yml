name: Bug report
description: Something is wrong with SimpleHarn
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, control tokens, or private model paths. Redact them
        before you submit. Report security problems through the Security tab, not here.
  - type: input
    id: version
    attributes:
      label: SimpleHarn version
      description: The version shown in the page header or `GET /har/status`.
      placeholder: "<version>"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Windows and GPU
      description: Windows version, GPU model, and driver version.
      placeholder: "Windows 11 24H2, RTX 4090, driver 616.92"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Put this row in ModelConf ...
        2. Start the harness ...
        3. Load the model ...
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Model row and relevant config
      description: Paste the row and the changed `simpleharn.json` keys. Redact tokens and private paths.
      render: yaml
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or refusal text
      description: Paste the refusal, the job id, or the relevant lines. Redact secrets and private paths.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I run the latest release.
          required: true
        - label: I removed keys, tokens, and private paths from this report.
          required: true
